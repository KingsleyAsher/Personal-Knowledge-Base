<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315d4c"><title>知识库 · 快速收集</title><link rel="manifest" href="/kb-core/capture.webmanifest"><link rel="stylesheet" href="/kb-core/capture.css"></head><body><main><p class="eyebrow">个人知识库</p><h1>快速收集</h1><p>资料保存到收件箱 / 快速收集，稍后再整理。</p><form id="capture-form"><label>标题<input id="title" maxlength="200"></label><label>网址<input id="url" type="url"></label><label>内容<textarea id="text" rows="8"></textarea></label><label>文件<input id="files" type="file" multiple></label><p id="attachments"></p><button id="save">确认保存到知识库</button></form><output id="result" role="status"></output><p class="hint">离线时可保留文字草稿。恢复连接后主动保存。浏览器支持安装时，将此页面添加到主屏幕，可在系统分享菜单中找到“知识库快速收集”。</p><button type="button" id="discard">清除本机文字草稿</button></main><script id="shared-draft" type="application/json">__KB_CAPTURE_DRAFT__</script><script src="/kb-core/capture.js"></script></body></html>
