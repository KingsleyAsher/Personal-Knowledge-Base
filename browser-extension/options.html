<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>知识库剪藏设置</title><link rel="stylesheet" href="style.css"><h1>连接个人知识库</h1><p>将下方扩展来源复制到知识库“收件箱 → 浏览器剪藏配对”，生成配对码。</p><p id="origin"></p><label>宿主地址<input id="host" placeholder="http://DSH_HOST:PORT"></label><label>配对码<input id="code" autocomplete="off"></label><button id="pair">配对</button><button id="clear">移除此浏览器的连接</button><output id="result" role="status"></output><p><small>只在主动保存当前网页时读取内容；连接凭据保存在本机扩展存储中。</small></p><script src="options.js"></script></html>
