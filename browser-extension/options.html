<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>知识库剪藏设置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-heading"><img src="icons/knowledge-base-48.png" alt=""><h1>连接个人知识库</h1></header>
  <p>将下方扩展来源复制到知识库“收件箱 → 浏览器剪藏配对”，生成配对码。</p>
  <p id="origin"></p>
  <label>连接方式<select id="mode"><option value="desktop">本机 DSH 桌面版（自动连接）</option><option value="custom">Web profile / 自定义地址</option></select></label>
  <p id="mode-help"><small>桌面版会自动连接本机 DSH，不需要输入桌面窗口的端口。</small></p>
  <label id="host-row" hidden>宿主地址<input id="host" placeholder="http://127.0.0.1:端口"></label>
  <label>配对码<input id="code" autocomplete="off"></label>
  <button id="pair">配对</button>
  <button id="clear">移除此浏览器的连接</button>
  <output id="result" role="status"></output>
  <p><small>只在主动保存当前网页时读取内容；连接凭据保存在本机扩展存储中。</small></p>
  <script src="options.js"></script>
</body>
</html>
