name: Existing knowledge framework checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/host/retrieval*'
      - 'src/host/workbench*'
      - 'src/host/relation-name-lookup.js'
      - 'tests/large-library.test.mjs'
      - 'tests/retrieval-limits.test.mjs'
      - 'tests/fixtures/retrieval-*-original.mjs'
      - '.github/workflows/existing-framework.yml'
jobs:
  exact-search:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/large-library.test.mjs tests/retrieval-limits.test.mjs tests/retrieval.test.mjs tests/retrieval-storage.test.mjs tests/performance-optimization.test.mjs tests/beta2-directed.test.mjs tests/knowledge-reference.test.mjs
